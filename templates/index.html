<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizza Hut 折價券大全</title>
    <style>
        :root {
            --bg-cream: #fff8ee;
            --bg-cheese: #ffe3a7;
            --bg-red: #e5452f;
            --text-main: #2c2119;
            --text-soft: #6b5448;
            --card: #fffdf9;
            --line: #f0d7ba;
            --ok: #1f7a3a;
            --danger: #b43320;
            --shadow: 0 16px 35px rgba(154, 58, 35, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text-main);
            font-family: "Noto Sans TC", "Microsoft JhengHei", "Trebuchet MS", sans-serif;
            background:
                radial-gradient(circle at 6% 10%, rgba(229, 69, 47, 0.17) 0 15%, transparent 16%),
                radial-gradient(circle at 92% 18%, rgba(255, 190, 96, 0.28) 0 18%, transparent 19%),
                linear-gradient(135deg, var(--bg-cream), #fff4de 50%, #ffe9c3 100%);
            padding: 36px 16px 54px;
        }

        .container {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        .hero {
            position: relative;
            overflow: hidden;
            background: linear-gradient(120deg, #fff7e9 0%, #fff1d4 52%, #ffe6bf 100%);
            border: 1px solid #f4d6b0;
            border-radius: 26px;
            box-shadow: var(--shadow);
            padding: 28px 24px;
            animation: rise 0.55s ease-out both;
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: auto -10% -50% auto;
            width: 360px;
            height: 260px;
            background: radial-gradient(circle, rgba(229, 69, 47, 0.15), transparent 68%);
            transform: rotate(-18deg);
            pointer-events: none;
        }

        .hero-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            border: 1px solid #f3ceb3;
            border-radius: 999px;
            padding: 8px 14px;
            color: #96301f;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--bg-red);
            box-shadow: 0 0 0 3px rgba(229, 69, 47, 0.2);
        }

        h1 {
            margin: 16px 0 10px;
            font-size: clamp(1.55rem, 2.1vw + 1rem, 2.35rem);
            line-height: 1.2;
            letter-spacing: 0.01em;
            font-family: "Rockwell", "Noto Serif TC", "Georgia", serif;
        }

        .subtitle {
            margin: 0 0 22px;
            color: var(--text-soft);
            max-width: 760px;
            line-height: 1.7;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            height: 48px;
            border: 1px solid #efcfb4;
            border-radius: 14px;
            outline: none;
            padding: 0 14px 0 42px;
            background: #fffdfa;
            color: var(--text-main);
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-box input:focus {
            border-color: #df7d46;
            box-shadow: 0 0 0 4px rgba(223, 125, 70, 0.18);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border: 2px solid #cb8b62;
            border-radius: 50%;
        }

        .search-icon::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 2px;
            background: #cb8b62;
            right: -6px;
            bottom: -4px;
            transform: rotate(40deg);
            border-radius: 2px;
        }

        .pill {
            background: #fff;
            border: 1px solid #efcfb4;
            border-radius: 999px;
            padding: 10px 14px;
            white-space: nowrap;
            font-weight: 700;
            color: #763f25;
            min-width: 126px;
            text-align: center;
        }

        .status {
            margin-top: 10px;
            min-height: 22px;
            font-size: 0.95rem;
            color: #805542;
        }

        .status.error {
            color: var(--danger);
        }

        .status.success {
            color: var(--ok);
        }

        .grid {
            margin-top: 22px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
            gap: 14px;
        }

        .coupon-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(142, 56, 35, 0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: cardIn 0.45s ease both;
            animation-delay: calc(var(--i, 0) * 40ms);
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            background: #fff0dc;
            color: #8b421f;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .code {
            margin: 0;
            font-size: 1.32rem;
            font-family: "Consolas", "Courier New", monospace;
            letter-spacing: 0.08em;
            color: #9f2f1e;
        }

        .description {
            margin: 0;
            color: #61483b;
            line-height: 1.6;
            min-height: 52px;
            word-break: break-word;
        }

        .preview {
            display: block;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #f2d6ba;
            background: #fff7ea;
        }

        .preview img {
            display: block;
            width: 100%;
            height: 168px;
            object-fit: cover;
        }

        .preview-empty {
            height: 168px;
            display: grid;
            place-items: center;
            color: #8b6a57;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            border-style: dashed;
        }

        .copy-btn {
            margin-top: auto;
            border: 0;
            border-radius: 12px;
            height: 40px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(120deg, #d6402a, #e9782f);
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .copy-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .empty {
            border: 1px dashed #d9b699;
            border-radius: 16px;
            background: rgba(255, 247, 235, 0.8);
            color: #86614e;
            text-align: center;
            padding: 24px 18px;
            margin-top: 14px;
        }

        .skeleton {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: linear-gradient(100deg, #fff9ef 15%, #fff1de 30%, #fff9ef 45%);
            background-size: 220% 100%;
            height: 182px;
            animation: shimmer 1.1s linear infinite;
        }

        .toast {
            position: fixed;
            right: 16px;
            bottom: 16px;
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            background: rgba(38, 31, 26, 0.92);
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            from {
                background-position: 100% 0;
            }
            to {
                background-position: -100% 0;
            }
        }

        @media (max-width: 820px) {
            .hero {
                padding: 22px 16px;
                border-radius: 20px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .pill {
                text-align: left;
                min-width: 0;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="hero">
            <div class="hero-top">
                <span class="brand"><span class="brand-dot"></span> Pizza Hut 優惠清單</span>
                <span class="pill">即時串接 API</span>
            </div>
            <h1>完整 Pizza Hut 折價券列表</h1>
            <p class="subtitle">
                一次查看所有可用折價券。支援關鍵字搜尋與代碼快速複製，找優惠更快、點餐更直覺。
            </p>
            <div class="controls">
                <label class="search-box" for="search-input">
                    <span class="search-icon" aria-hidden="true"></span>
                    <input id="search-input" type="text" placeholder="搜尋代碼或優惠內容..." />
                </label>
                <div class="pill">總數 <span id="total-count">0</span></div>
                <div class="pill">顯示 <span id="visible-count">0</span></div>
            </div>
            <p id="status" class="status" aria-live="polite"></p>
        </section>

        <section>
            <div id="coupon-list" class="grid" aria-live="polite"></div>
            <div id="empty-state" class="empty" hidden>找不到符合條件的折價券，試試看不同關鍵字。</div>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        const listEl = document.getElementById("coupon-list");
        const searchEl = document.getElementById("search-input");
        const statusEl = document.getElementById("status");
        const totalCountEl = document.getElementById("total-count");
        const visibleCountEl = document.getElementById("visible-count");
        const emptyStateEl = document.getElementById("empty-state");
        const toastEl = document.getElementById("toast");

        let allCoupons = [];

        function escapeHtml(text) {
            return text
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.add("show");
            window.clearTimeout(showToast.timer);
            showToast.timer = window.setTimeout(() => {
                toastEl.classList.remove("show");
            }, 1400);
        }

        function setStatus(message, type = "") {
            statusEl.textContent = message;
            statusEl.className = type ? `status ${type}` : "status";
        }

        function renderSkeletons(count = 6) {
            listEl.innerHTML = "";
            for (let i = 0; i < count; i += 1) {
                const skeleton = document.createElement("div");
                skeleton.className = "skeleton";
                listEl.appendChild(skeleton);
            }
        }

        function createCard(coupon, index) {
            const code = escapeHtml(String(coupon.coupon_num ?? "").trim() || "未提供");
            const description = escapeHtml(String(coupon.description ?? "").trim() || "暫無說明");
            const rawPreviewImage = String(coupon.preview_image ?? "").trim();
            const previewImage = rawPreviewImage && !/^javascript:/i.test(rawPreviewImage)
                ? escapeHtml(rawPreviewImage)
                : "";
            const previewHtml = previewImage
                ? `<a class="preview" href="${previewImage}" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="${previewImage}" alt="優惠餐點預覽圖" /></a>`
                : `<div class="preview preview-empty" aria-label="無預覽圖">暫無預覽圖</div>`;

            const card = document.createElement("article");
            card.className = "coupon-card";
            card.style.setProperty("--i", index);
            card.innerHTML = `
                <div class="card-head">
                    <span class="tag">優惠代碼</span>
                    <h3 class="code">${code}</h3>
                </div>
                ${previewHtml}
                <p class="description">${description}</p>
                <button class="copy-btn" onclick="window.open('https://www.pizzahut.com.tw/order/?&type_id=1025&cno=${code}', '_blank')" type="button">跳轉訂餐</button>
            `;
            return card;
        }

        function renderCoupons(coupons) {
            listEl.innerHTML = "";
            visibleCountEl.textContent = coupons.length;
            emptyStateEl.hidden = coupons.length > 0;

            coupons.forEach((coupon, index) => {
                listEl.appendChild(createCard(coupon, index));
            });
        }

        function normalize(value) {
            return String(value ?? "").toLowerCase();
        }

        function filterCoupons(keyword) {
            const key = normalize(keyword).trim();
            if (!key) {
                return allCoupons;
            }

            return allCoupons.filter((coupon) => {
                return normalize(coupon.coupon_num).includes(key) ||
                    normalize(coupon.description).includes(key);
            });
        }

        async function copyCode(code) {
            try {
                await navigator.clipboard.writeText(code);
                showToast(`已複製 ${code}`);
            } catch {
                showToast("複製失敗，請手動選取代碼");
            }
        }

        async function loadCoupons() {
            renderSkeletons();
            setStatus("正在載入折價券資料...");

            try {
                const response = await fetch("/api/coupons");
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                allCoupons = Array.isArray(data) ? data : [];
                totalCountEl.textContent = allCoupons.length;
                renderCoupons(allCoupons);
                setStatus(`已載入 ${allCoupons.length} 筆折價券`, "success");
            } catch (error) {
                allCoupons = [];
                totalCountEl.textContent = "0";
                renderCoupons([]);
                setStatus(`載入失敗：${error.message}`, "error");
            }
        }

        searchEl.addEventListener("input", () => {
            const filtered = filterCoupons(searchEl.value);
            renderCoupons(filtered);
            if (searchEl.value.trim()) {
                setStatus(`搜尋「${searchEl.value.trim()}」共 ${filtered.length} 筆`);
            } else if (allCoupons.length > 0) {
                setStatus(`已載入 ${allCoupons.length} 筆折價券`, "success");
            }
        });

        listEl.addEventListener("click", (event) => {
            const button = event.target.closest(".copy-btn");
            if (!button) {
                return;
            }
            copyCode(button.dataset.code || "");
        });

        loadCoupons();
    </script>
</body>
</html>
