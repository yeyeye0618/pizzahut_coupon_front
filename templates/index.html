<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizza Hut 折價券大全</title>
    <style>
        :root {
            --bg-cream: #fff8ee;
            --bg-cheese: #ffe3a7;
            --bg-red: #e5452f;
            --text-main: #2c2119;
            --text-soft: #6b5448;
            --card: #fffdf9;
            --line: #f0d7ba;
            --ok: #1f7a3a;
            --danger: #b43320;
            --shadow: 0 16px 35px rgba(154, 58, 35, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text-main);
            font-family: "Noto Sans TC", "Microsoft JhengHei", "Trebuchet MS", sans-serif;
            background:
                radial-gradient(circle at 6% 10%, rgba(229, 69, 47, 0.17) 0 15%, transparent 16%),
                radial-gradient(circle at 92% 18%, rgba(255, 190, 96, 0.28) 0 18%, transparent 19%),
                linear-gradient(135deg, var(--bg-cream), #fff4de 50%, #ffe9c3 100%);
            padding: 36px 16px 54px;
        }

        .container {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        .hero {
            position: relative;
            overflow: hidden;
            background: linear-gradient(120deg, #fff7e9 0%, #fff1d4 52%, #ffe6bf 100%);
            border: 1px solid #f4d6b0;
            border-radius: 26px;
            box-shadow: var(--shadow);
            padding: 28px 24px;
            animation: rise 0.55s ease-out both;
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: auto -10% -50% auto;
            width: 360px;
            height: 260px;
            background: radial-gradient(circle, rgba(229, 69, 47, 0.15), transparent 68%);
            transform: rotate(-18deg);
            pointer-events: none;
        }

        .hero-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            border: 1px solid #f3ceb3;
            border-radius: 999px;
            padding: 8px 14px;
            color: #96301f;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--bg-red);
            box-shadow: 0 0 0 3px rgba(229, 69, 47, 0.2);
        }

        h1 {
            margin: 16px 0 10px;
            font-size: clamp(1.55rem, 2.1vw + 1rem, 2.35rem);
            line-height: 1.2;
            letter-spacing: 0.01em;
            font-family: "Rockwell", "Noto Serif TC", "Georgia", serif;
        }

        .subtitle {
            margin: 0 0 22px;
            color: var(--text-soft);
            max-width: 760px;
            line-height: 1.7;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            align-items: center;
        }

        .filter-bar {
            margin-top: 12px;
            display: grid;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(255, 252, 246, 0.85);
            border: 1px solid #f1d7bb;
            border-radius: 14px;
        }

        .filter-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-title {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 700;
            color: #7f4223;
        }

        .filter-summary {
            font-size: 0.82rem;
            color: #8b6a57;
        }

        .match-mode {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px;
            border-radius: 999px;
            border: 1px solid #efcfb4;
            background: #fff;
        }

        .mode-option {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.82rem;
            color: #784a31;
            user-select: none;
        }

        .mode-option input {
            accent-color: #d6402a;
            margin: 0;
        }

        .tags-filter-list {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-tag {
            border: 1px solid #efcfb4;
            border-radius: 999px;
            background: #fff;
            color: #763f25;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 12px;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .filter-tag:hover {
            transform: translateY(-1px);
            border-color: #e69f70;
        }

        .filter-tag.active {
            background: linear-gradient(120deg, #d6402a, #e9782f);
            color: #fff;
            border-color: #d6402a;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            height: 48px;
            border: 1px solid #efcfb4;
            border-radius: 14px;
            outline: none;
            padding: 0 14px 0 42px;
            background: #fffdfa;
            color: var(--text-main);
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-box input:focus {
            border-color: #df7d46;
            box-shadow: 0 0 0 4px rgba(223, 125, 70, 0.18);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border: 2px solid #cb8b62;
            border-radius: 50%;
        }

        .search-icon::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 2px;
            background: #cb8b62;
            right: -6px;
            bottom: -4px;
            transform: rotate(40deg);
            border-radius: 2px;
        }

        .pill {
            background: #fff;
            border: 1px solid #efcfb4;
            border-radius: 999px;
            padding: 10px 14px;
            white-space: nowrap;
            font-weight: 700;
            color: #763f25;
            min-width: 126px;
            text-align: center;
        }

        .status {
            margin-top: 10px;
            min-height: 22px;
            font-size: 0.95rem;
            color: #805542;
        }

        .status.error {
            color: var(--danger);
        }

        .status.success {
            color: var(--ok);
        }

        .grid {
            margin-top: 22px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
            gap: 14px;
        }

        .coupon-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(142, 56, 35, 0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: cardIn 0.45s ease both;
            animation-delay: calc(var(--i, 0) * 40ms);
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            background: #fff0dc;
            color: #8b421f;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .code {
            margin: 0;
            font-size: 1.32rem;
            font-family: "Consolas", "Courier New", monospace;
            letter-spacing: 0.08em;
            color: #9f2f1e;
        }

        .description {
            margin: 0;
            color: #0f0b09;
            line-height: 1.6;
            min-height: 52px;
            word-break: break-word;
        }

        .keyword-highlight {
            background-color: inherit;
            color: red;
            border-radius: 4px;
            padding: 0 2px;
        }

        .preview {
            display: block;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #f2d6ba;
            background: #fff7ea;
        }

        .preview img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .preview-empty {
            height: 237.5px;
            display: grid;
            place-items: center;
            color: #8b6a57;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            border-style: dashed;
        }

        .tags-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tags-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #8b421f;
            letter-spacing: 0.02em;
        }

        .tags-list {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tags-item {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid #efcfb4;
            background: #fff7ea;
            color: #763f25;
            font-size: 0.78rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .copy-btn {
            margin-top: auto;
            border: 0;
            border-radius: 12px;
            height: 40px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(120deg, #d6402a, #e9782f);
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .copy-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .empty {
            border: 1px dashed #d9b699;
            border-radius: 16px;
            background: rgba(255, 247, 235, 0.8);
            color: #86614e;
            text-align: center;
            padding: 24px 18px;
            margin-top: 14px;
        }

        .infinite-trigger {
            margin-top: 12px;
            min-height: 22px;
            text-align: center;
            color: #8a6957;
            font-size: 0.92rem;
        }

        .skeleton {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: linear-gradient(100deg, #fff9ef 15%, #fff1de 30%, #fff9ef 45%);
            background-size: 220% 100%;
            height: 182px;
            animation: shimmer 1.1s linear infinite;
        }

        .toast {
            position: fixed;
            right: 16px;
            bottom: 16px;
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            background: rgba(38, 31, 26, 0.92);
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            from {
                background-position: 100% 0;
            }
            to {
                background-position: -100% 0;
            }
        }

        @media (max-width: 820px) {
            .hero {
                padding: 22px 16px;
                border-radius: 20px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .pill {
                text-align: left;
                min-width: 0;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .filter-head {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1>Pizza Hut Coupon</h1>
            <div class="controls">
                <label class="search-box" for="search-input">
                    <span class="search-icon" aria-hidden="true"></span>
                    <input id="search-input" type="text" placeholder="搜尋代碼或優惠內容..." />
                </label>
                <div class="pill">總數 <span id="total-count">0</span></div>
                <div class="pill">顯示 <span id="visible-count">0</span></div>
            </div>
            <div class="filter-bar">
                <div class="filter-head">
                    <div id="tags-filter-list" class="tags-filter-list" aria-live="polite"></div>
                    <div class="match-mode" role="radiogroup" aria-label="標籤篩選模式">
                        <label class="mode-option">
                            <input type="radio" name="tag-match-mode" value="union" checked />
                            OR
                        </label>
                        <label class="mode-option">
                            <input type="radio" name="tag-match-mode" value="intersection" />
                            AND
                        </label>
                    </div>
                </div>
            </div>
            <p id="status" class="status" aria-live="polite"></p>
        </section>

        <section>
            <div id="coupon-list" class="grid" aria-live="polite"></div>
            <div id="infinite-trigger" class="infinite-trigger" aria-live="polite" hidden></div>
            <div id="empty-state" class="empty" hidden>找不到符合條件的折價券，試試看不同關鍵字。</div>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        const listEl = document.getElementById("coupon-list");
        const searchEl = document.getElementById("search-input");
        const statusEl = document.getElementById("status");
        const totalCountEl = document.getElementById("total-count");
        const visibleCountEl = document.getElementById("visible-count");
        const emptyStateEl = document.getElementById("empty-state");
        const infiniteTriggerEl = document.getElementById("infinite-trigger");
        const toastEl = document.getElementById("toast");
        const tagsFilterListEl = document.getElementById("tags-filter-list");
        const tagsFilterSummaryEl = document.getElementById("tags-filter-summary");

        const PAGE_SIZE = 12;
        let allCoupons = [];
        let filteredCoupons = [];
        let renderedCount = 0;
        let isAppending = false;
        let activeKeyword = "";
        let tagMatchMode = "union";
        const selectedTags = new Set();
        let allAvailableTags = [];

        function escapeHtml(text) {
            return text
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function escapeRegExp(text) {
            return String(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        function highlightText(text, keyword) {
            const key = String(keyword ?? "").trim();
            if (!key) {
                return text;
            }

            const keywordRegex = new RegExp(`(${escapeRegExp(key)})`, "gi");
            return text.replace(keywordRegex, `<mark class="keyword-highlight">$1</mark>`);
        }

        function highlightTextInHtml(html, keyword) {
            const key = String(keyword ?? "").trim();
            if (!key) {
                return html;
            }

            return html
                .split(/(<[^>]+>)/g)
                .map((part) => {
                    if (part.startsWith("<") && part.endsWith(">")) {
                        return part;
                    }
                    return highlightText(part, key);
                })
                .join("");
        }

        function normalizeTags(rawTags) {
            const source = Array.isArray(rawTags) ? rawTags : String(rawTags ?? "").split(/[、,，|]/);
            return source
                .map((tag) => String(tag ?? "").trim())
                .filter(Boolean);
        }

        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.add("show");
            window.clearTimeout(showToast.timer);
            showToast.timer = window.setTimeout(() => {
                toastEl.classList.remove("show");
            }, 1400);
        }

        function setStatus(message, type = "") {
            statusEl.textContent = message;
            statusEl.className = type ? `status ${type}` : "status";
        }

        function renderSkeletons(count = 6) {
            listEl.innerHTML = "";
            infiniteTriggerEl.hidden = true;
            for (let i = 0; i < count; i += 1) {
                const skeleton = document.createElement("div");
                skeleton.className = "skeleton";
                listEl.appendChild(skeleton);
            }
        }

        function createCard(coupon, index, keyword = "") {
            const code = escapeHtml(String(coupon.coupon_num ?? "").trim() || "未提供");
            var description = escapeHtml(String(coupon.description ?? "").trim() || "暫無說明");
            const rawPreviewImage = String(coupon.preview_image ?? "").trim();
            const tags = normalizeTags(coupon.tags);
            const previewImage = rawPreviewImage && !/^javascript:/i.test(rawPreviewImage)
                ? escapeHtml(rawPreviewImage)
                : "";
            const previewHtml = previewImage
                ? `<a class="preview" href="${previewImage}" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="${previewImage}" alt="優惠餐點預覽圖" /></a>`
                : `<div class="preview preview-empty" aria-label="無預覽圖">暫無預覽圖</div>`;

            const price_regex = /價格：(\$\d+(?:~\$\d+)?)/;
            const match = description.match(price_regex);
            if (match) {
                description = description.replace(price_regex, `價格：<span style="color: red; font-weight: bold;">$1</span>`);
            }
            description = description.replaceAll('。', `<br><br>`);

            const highlightedCode = highlightText(code, keyword);
            const highlightedDescription = highlightTextInHtml(description, keyword);
            const normalizedTags = tags.map((tag) => escapeHtml(tag));
            const tagsHtml = normalizedTags.length
                ? `<div class="tags-row" aria-label="優惠標籤"><div class="tags-list">${normalizedTags.map((tag) => `<span class="tags-item">${highlightText(tag, keyword)}</span>`).join("")}</div></div>`
                : "";
            
            const card = document.createElement("article");
            card.className = "coupon-card";
            card.style.setProperty("--i", index);
            card.innerHTML = `
                <div class="card-head">
                    <span class="tag">優惠代碼</span>
                    <h3 class="code">${highlightedCode}</h3>
                </div>
                ${previewHtml}
                ${tagsHtml}
                <p class="description">${highlightedDescription}</p>
                <button class="copy-btn" onclick="window.open('https://www.pizzahut.com.tw/order/?&type_id=1025&cno=${code}', '_blank')" type="button">跳轉訂餐</button>
            `;
            return card;
        }

        function hasMoreCoupons() {
            return renderedCount < filteredCoupons.length;
        }

        function updateInfiniteTrigger() {
            if (filteredCoupons.length === 0) {
                infiniteTriggerEl.hidden = true;
                return;
            }

            infiniteTriggerEl.hidden = false;
            infiniteTriggerEl.textContent = hasMoreCoupons()
                ? "往下滑可載入更多折價券..."
                : `已顯示全部 ${filteredCoupons.length} 筆`;
        }

        function appendNextPage() {
            if (isAppending || !hasMoreCoupons()) {
                updateInfiniteTrigger();
                return;
            }

            isAppending = true;
            const startIndex = renderedCount;
            const nextCoupons = filteredCoupons.slice(startIndex, startIndex + PAGE_SIZE);

            nextCoupons.forEach((coupon, index) => {
                listEl.appendChild(createCard(coupon, startIndex + index, activeKeyword));
            });

            renderedCount += nextCoupons.length;
            visibleCountEl.textContent = renderedCount;
            emptyStateEl.hidden = filteredCoupons.length > 0;
            isAppending = false;
            updateInfiniteTrigger();
        }

        function renderCoupons(coupons, keyword = "") {
            filteredCoupons = coupons;
            activeKeyword = String(keyword ?? "").trim();
            renderedCount = 0;
            listEl.innerHTML = "";
            visibleCountEl.textContent = "0";
            emptyStateEl.hidden = coupons.length > 0;

            appendNextPage();

            while (hasMoreCoupons() && listEl.getBoundingClientRect().bottom < window.innerHeight + 80) {
                appendNextPage();
            }

            updateInfiniteTrigger();
        }

        function normalize(value) {
            return String(value ?? "").toLowerCase();
        }

        function buildTagCatalog(coupons) {
            const counter = new Map();
            coupons.forEach((coupon) => {
                normalizeTags(coupon.tags).forEach((tag) => {
                    counter.set(tag, (counter.get(tag) || 0) + 1);
                });
            });

            return [...counter.entries()]
                .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh-Hant"))
                .map(([name]) => name);
        }

        function renderTagFilters(tags) {
            if (!tagsFilterListEl) {
                return;
            }
            tagsFilterListEl.innerHTML = "";
            tags.forEach((tag) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "filter-tag";
                button.dataset.tag = tag;
                button.textContent = tag;
                button.setAttribute("aria-pressed", selectedTags.has(tag) ? "true" : "false");
                if (selectedTags.has(tag)) {
                    button.classList.add("active");
                }
                tagsFilterListEl.appendChild(button);
            });
            updateTagFilterSummary();
        }

        function updateTagFilterSummary() {
            if (!tagsFilterSummaryEl) {
                return;
            }
            const count = selectedTags.size;
            if (!count) {
                tagsFilterSummaryEl.textContent = "未選取標籤";
                return;
            }
            tagsFilterSummaryEl.textContent = `已選 ${count} 個標籤（${tagMatchMode === "intersection" ? "交集" : "聯集"}）`;
        }

        function getTagMatch(couponTags, tagsToMatch, mode) {
            if (!tagsToMatch.length) {
                return true;
            }
            const couponTagSet = new Set(couponTags);
            if (mode === "intersection") {
                return tagsToMatch.every((tag) => couponTagSet.has(tag));
            }
            return tagsToMatch.some((tag) => couponTagSet.has(tag));
        }

        function filterCoupons(keyword) {
            const key = normalize(keyword).trim();
            const tagsToMatch = [...selectedTags];

            return allCoupons.filter((coupon) => {
                const keywordMatched = !key ||
                    normalize(coupon.coupon_num).includes(key) ||
                    normalize(coupon.description).includes(key) ||
                    normalize(normalizeTags(coupon.tags).join(" ")).includes(key);
                if (!keywordMatched) {
                    return false;
                }
                return getTagMatch(normalizeTags(coupon.tags), tagsToMatch, tagMatchMode);
            });
        }

        function updateResults() {
            const keyword = searchEl.value;
            const filtered = filterCoupons(keyword);
            renderCoupons(filtered, keyword);

            const trimmedKeyword = keyword.trim();
            const hasKeyword = Boolean(trimmedKeyword);
            const hasTags = selectedTags.size > 0;
            if (hasKeyword || hasTags) {
                const conditions = [];
                if (hasKeyword) {
                    conditions.push(`關鍵字「${trimmedKeyword}」`);
                }
                if (hasTags) {
                    conditions.push(`標籤${tagMatchMode === "intersection" ? "交集" : "聯集"} ${selectedTags.size} 個`);
                }
                setStatus(`${conditions.join("＋")} 共 ${filtered.length} 筆`);
            } else if (allCoupons.length > 0) {
                setStatus(`已載入 ${allCoupons.length} 筆折價券`, "success");
            }
        }

        async function copyCode(code) {
            try {
                await navigator.clipboard.writeText(code);
                showToast(`已複製 ${code}`);
            } catch {
                showToast("複製失敗，請手動選取代碼");
            }
        }

        async function loadCoupons() {
            renderSkeletons();
            setStatus("正在載入折價券資料...");

            try {
                const response = await fetch("/api/coupons");
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                allCoupons = Array.isArray(data) ? data : [];
                allAvailableTags = buildTagCatalog(allCoupons);
                renderTagFilters(allAvailableTags);
                totalCountEl.textContent = allCoupons.length;
                renderCoupons(allCoupons, searchEl.value);
                setStatus(`已載入 ${allCoupons.length} 筆折價券`, "success");
            } catch (error) {
                allCoupons = [];
                allAvailableTags = [];
                selectedTags.clear();
                renderTagFilters(allAvailableTags);
                totalCountEl.textContent = "0";
                renderCoupons([], searchEl.value);
                setStatus(`載入失敗：${error.message}`, "error");
            }
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries.some((entry) => entry.isIntersecting)) {
                appendNextPage();
            }
        }, {
            root: null,
            rootMargin: "180px 0px",
            threshold: 0
        });

        observer.observe(infiniteTriggerEl);

        searchEl.addEventListener("input", updateResults);

        if (tagsFilterListEl) {
            tagsFilterListEl.addEventListener("click", (event) => {
                const button = event.target.closest(".filter-tag");
                if (!button) {
                    return;
                }
                const tag = button.dataset.tag;
                if (!tag) {
                    return;
                }

                if (selectedTags.has(tag)) {
                    selectedTags.delete(tag);
                } else {
                    selectedTags.add(tag);
                }

                button.classList.toggle("active", selectedTags.has(tag));
                button.setAttribute("aria-pressed", selectedTags.has(tag) ? "true" : "false");
                updateTagFilterSummary();
                updateResults();
            });
        }

        document.querySelectorAll("input[name='tag-match-mode']").forEach((radio) => {
            radio.addEventListener("change", (event) => {
                const nextMode = event.target.value === "intersection" ? "intersection" : "union";
                tagMatchMode = nextMode;
                updateTagFilterSummary();
                updateResults();
            });
        });

        listEl.addEventListener("click", (event) => {
            const button = event.target.closest(".copy-btn");
            if (!button) {
                return;
            }
            copyCode(button.dataset.code || "");
        });

        loadCoupons();
    </script>
</body>
</html>
