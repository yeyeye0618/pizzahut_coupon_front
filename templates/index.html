<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizza Hut 折價券大全</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1>Pizza Hut Coupon</h1>
            <div class="controls">
                <label class="search-box" for="search-input">
                    <span class="search-icon" aria-hidden="true"></span>
                    <input id="search-input" type="text" placeholder="搜尋代碼或優惠內容..." />
                </label>
                <div class="pill">總數 <span id="total-count">0</span></div>
                <div class="pill">顯示 <span id="visible-count">0</span></div>
            </div>
            <div class="filter-bar">
                <div class="filter-head">
                    <div id="tags-filter-list" class="tags-filter-list" aria-live="polite"></div>
                    <div class="match-mode" role="radiogroup" aria-label="標籤篩選模式">
                        <label class="mode-option">
                            <input type="radio" name="tag-match-mode" value="union" checked />
                            OR
                        </label>
                        <label class="mode-option">
                            <input type="radio" name="tag-match-mode" value="intersection" />
                            AND
                        </label>
                    </div>
                </div>
            </div>
            <p id="status" class="status" aria-live="polite"></p>
        </section>

        <section>
            <div id="coupon-list" class="grid" aria-live="polite"></div>
            <div id="infinite-trigger" class="infinite-trigger" aria-live="polite" hidden></div>
            <div id="empty-state" class="empty" hidden>找不到符合條件的折價券，試試看不同關鍵字。</div>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        const listEl = document.getElementById("coupon-list");
        const searchEl = document.getElementById("search-input");
        const statusEl = document.getElementById("status");
        const totalCountEl = document.getElementById("total-count");
        const visibleCountEl = document.getElementById("visible-count");
        const emptyStateEl = document.getElementById("empty-state");
        const infiniteTriggerEl = document.getElementById("infinite-trigger");
        const toastEl = document.getElementById("toast");
        const tagsFilterListEl = document.getElementById("tags-filter-list");
        const tagsFilterSummaryEl = document.getElementById("tags-filter-summary");

        const PAGE_SIZE = 12;
        let allCoupons = [];
        let filteredCoupons = [];
        let renderedCount = 0;
        let isAppending = false;
        let activeKeyword = "";
        let tagMatchMode = "union";
        const selectedTags = new Set();
        let allAvailableTags = [];

        function escapeHtml(text) {
            return text
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function escapeRegExp(text) {
            return String(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        function highlightText(text, keyword) {
            const key = String(keyword ?? "").trim();
            if (!key) {
                return text;
            }

            const keywordRegex = new RegExp(`(${escapeRegExp(key)})`, "gi");
            return text.replace(keywordRegex, `<mark class="keyword-highlight">$1</mark>`);
        }

        function highlightTextInHtml(html, keyword) {
            const key = String(keyword ?? "").trim();
            if (!key) {
                return html;
            }

            return html
                .split(/(<[^>]+>)/g)
                .map((part) => {
                    if (part.startsWith("<") && part.endsWith(">")) {
                        return part;
                    }
                    return highlightText(part, key);
                })
                .join("");
        }

        function normalizeTags(rawTags) {
            const source = Array.isArray(rawTags) ? rawTags : String(rawTags ?? "").split(/[、,，|]/);
            return source
                .map((tag) => String(tag ?? "").trim())
                .filter(Boolean);
        }

        function formatDescriptionHtml(rawText, keyword) {
            let html = escapeHtml(String(rawText ?? "").trim() || "暫無說明");
            const priceRegex = /價格：(\$\d+(?:~\$\d+)?)/;
            html = html.replace(priceRegex, '價格：<span class="price-highlight">$1</span>');
            html = html.replaceAll('。', '<br><br>');
            return highlightTextInHtml(html, keyword);
        }

        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.add("show");
            window.clearTimeout(showToast.timer);
            showToast.timer = window.setTimeout(() => {
                toastEl.classList.remove("show");
            }, 1400);
        }

        function setStatus(message, type = "") {
            statusEl.textContent = message;
            statusEl.className = type ? `status ${type}` : "status";
        }

        function renderSkeletons(count = 6) {
            listEl.innerHTML = "";
            infiniteTriggerEl.hidden = true;
            for (let i = 0; i < count; i += 1) {
                const skeleton = document.createElement("div");
                skeleton.className = "skeleton";
                listEl.appendChild(skeleton);
            }
        }

        function createCard(coupon, index, keyword = "") {
            const code = escapeHtml(String(coupon.coupon_num ?? "").trim() || "未提供");
            const rawDescription = String(coupon.description ?? "").trim() || "暫無說明";
            const rawPreviewImage = String(coupon.preview_image ?? "").trim();
            const tags = normalizeTags(coupon.tags);
            const previewImage = rawPreviewImage && !/^javascript:/i.test(rawPreviewImage)
                ? escapeHtml(rawPreviewImage)
                : "";
            const previewHtml = previewImage
                ? `<div class="preview"><img loading="lazy" src="${previewImage}" alt="優惠餐點預覽圖" /></div>`
                : `<div class="preview preview-empty" aria-label="無預覽圖">暫無預覽圖</div>`;

            const highlightedCode = highlightText(code, keyword);
            const fullDescriptionHtml = formatDescriptionHtml(rawDescription, keyword);
            const isLongDescription = rawDescription.length > 30;
            const shortDescriptionHtml = isLongDescription
                ? formatDescriptionHtml(`${rawDescription.slice(0, 30)}…`, keyword)
                : fullDescriptionHtml;
            const normalizedTags = tags.map((tag) => escapeHtml(tag));
            const tagsHtml = `<div class="tags-row${normalizedTags.length ? "" : " tags-row-empty"}" aria-label="優惠標籤"${normalizedTags.length ? "" : " aria-hidden=\"true\""}><div class="tags-list">${normalizedTags.map((tag) => `<span class="tags-item">${highlightText(tag, keyword)}</span>`).join("")}</div></div>`;
            
            const card = document.createElement("article");
            card.className = "coupon-card";
            card.style.setProperty("--i", index);
            card.innerHTML = `
                <div class="card-head">
                    <span class="tag">優惠代碼</span>
                    <h3 class="code">${highlightedCode}</h3>
                </div>
                ${previewHtml}
                ${tagsHtml}
                <div class="description-wrap">
                    <p class="description">
                        <span class="description-text">${shortDescriptionHtml}</span>
                    </p>
                    ${isLongDescription ? `<button class="description-toggle" type="button" data-expanded="false" data-short-html="${encodeURIComponent(shortDescriptionHtml)}" data-full-html="${encodeURIComponent(fullDescriptionHtml)}">顯示更多</button>` : ""}
                </div>
                <button class="copy-btn" onclick="window.open('https://www.pizzahut.com.tw/order/?type_id=1025&cno=${code}', '_blank')" type="button">跳轉訂餐</button>
            `;
            return card;
        }

        function hasMoreCoupons() {
            return renderedCount < filteredCoupons.length;
        }

        function updateInfiniteTrigger() {
            if (filteredCoupons.length === 0) {
                infiniteTriggerEl.hidden = true;
                return;
            }

            infiniteTriggerEl.hidden = false;
            infiniteTriggerEl.textContent = hasMoreCoupons()
                ? "往下滑可載入更多折價券..."
                : `已顯示全部 ${filteredCoupons.length} 筆`;
        }

        function appendNextPage() {
            if (isAppending || !hasMoreCoupons()) {
                updateInfiniteTrigger();
                return;
            }

            isAppending = true;
            const startIndex = renderedCount;
            const nextCoupons = filteredCoupons.slice(startIndex, startIndex + PAGE_SIZE);

            nextCoupons.forEach((coupon, index) => {
                listEl.appendChild(createCard(coupon, startIndex + index, activeKeyword));
            });

            renderedCount += nextCoupons.length;
            visibleCountEl.textContent = renderedCount;
            emptyStateEl.hidden = filteredCoupons.length > 0;
            isAppending = false;
            updateInfiniteTrigger();
        }

        function renderCoupons(coupons, keyword = "") {
            filteredCoupons = coupons;
            activeKeyword = String(keyword ?? "").trim();
            renderedCount = 0;
            listEl.innerHTML = "";
            visibleCountEl.textContent = "0";
            emptyStateEl.hidden = coupons.length > 0;

            appendNextPage();

            while (hasMoreCoupons() && listEl.getBoundingClientRect().bottom < window.innerHeight + 80) {
                appendNextPage();
            }

            updateInfiniteTrigger();
        }

        function normalize(value) {
            return String(value ?? "").toLowerCase();
        }

        function buildTagCatalog(coupons) {
            const counter = new Map();
            coupons.forEach((coupon) => {
                normalizeTags(coupon.tags).forEach((tag) => {
                    counter.set(tag, (counter.get(tag) || 0) + 1);
                });
            });

            return [...counter.entries()]
                .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh-Hant"))
                .map(([name]) => name);
        }

        function renderTagFilters(tags) {
            if (!tagsFilterListEl) {
                return;
            }
            tagsFilterListEl.innerHTML = "";
            tags.forEach((tag) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "filter-tag";
                button.dataset.tag = tag;
                button.textContent = tag;
                button.setAttribute("aria-pressed", selectedTags.has(tag) ? "true" : "false");
                if (selectedTags.has(tag)) {
                    button.classList.add("active");
                }
                tagsFilterListEl.appendChild(button);
            });
            updateTagFilterSummary();
        }

        function updateTagFilterSummary() {
            if (!tagsFilterSummaryEl) {
                return;
            }
            const count = selectedTags.size;
            if (!count) {
                tagsFilterSummaryEl.textContent = "未選取標籤";
                return;
            }
            tagsFilterSummaryEl.textContent = `已選 ${count} 個標籤（${tagMatchMode === "intersection" ? "交集" : "聯集"}）`;
        }

        function getTagMatch(couponTags, tagsToMatch, mode) {
            if (!tagsToMatch.length) {
                return true;
            }
            const couponTagSet = new Set(couponTags);
            if (mode === "intersection") {
                return tagsToMatch.every((tag) => couponTagSet.has(tag));
            }
            return tagsToMatch.some((tag) => couponTagSet.has(tag));
        }

        function filterCoupons(keyword) {
            const key = normalize(keyword).trim();
            const tagsToMatch = [...selectedTags];

            return allCoupons.filter((coupon) => {
                const keywordMatched = !key ||
                    normalize(coupon.coupon_num).includes(key) ||
                    normalize(coupon.description).includes(key) ||
                    normalize(normalizeTags(coupon.tags).join(" ")).includes(key);
                if (!keywordMatched) {
                    return false;
                }
                return getTagMatch(normalizeTags(coupon.tags), tagsToMatch, tagMatchMode);
            });
        }

        function updateResults() {
            const keyword = searchEl.value;
            const filtered = filterCoupons(keyword);
            renderCoupons(filtered, keyword);

            const trimmedKeyword = keyword.trim();
            const hasKeyword = Boolean(trimmedKeyword);
            const hasTags = selectedTags.size > 0;
            if (hasKeyword || hasTags) {
                const conditions = [];
                if (hasKeyword) {
                    conditions.push(`關鍵字「${trimmedKeyword}」`);
                }
                if (hasTags) {
                    conditions.push(`標籤${tagMatchMode === "intersection" ? "交集" : "聯集"} ${selectedTags.size} 個`);
                }
                setStatus(`${conditions.join("＋")} 共 ${filtered.length} 筆`);
            } else if (allCoupons.length > 0) {
                setStatus(`已載入 ${allCoupons.length} 筆折價券`, "success");
            }
        }

        async function copyCode(code) {
            try {
                await navigator.clipboard.writeText(code);
                showToast(`已複製 ${code}`);
            } catch {
                showToast("複製失敗，請手動選取代碼");
            }
        }

        async function loadCoupons() {
            renderSkeletons();
            setStatus("正在載入折價券資料...");

            try {
                const response = await fetch("/api/coupons");
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                allCoupons = Array.isArray(data) ? data : [];
                allAvailableTags = buildTagCatalog(allCoupons);
                renderTagFilters(allAvailableTags);
                totalCountEl.textContent = allCoupons.length;
                renderCoupons(allCoupons, searchEl.value);
                setStatus(`已載入 ${allCoupons.length} 筆折價券`, "success");
            } catch (error) {
                allCoupons = [];
                allAvailableTags = [];
                selectedTags.clear();
                renderTagFilters(allAvailableTags);
                totalCountEl.textContent = "0";
                renderCoupons([], searchEl.value);
                setStatus(`載入失敗：${error.message}`, "error");
            }
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries.some((entry) => entry.isIntersecting)) {
                appendNextPage();
            }
        }, {
            root: null,
            rootMargin: "180px 0px",
            threshold: 0
        });

        observer.observe(infiniteTriggerEl);

        searchEl.addEventListener("input", updateResults);

        if (tagsFilterListEl) {
            tagsFilterListEl.addEventListener("click", (event) => {
                const button = event.target.closest(".filter-tag");
                if (!button) {
                    return;
                }
                const tag = button.dataset.tag;
                if (!tag) {
                    return;
                }

                if (selectedTags.has(tag)) {
                    selectedTags.delete(tag);
                } else {
                    selectedTags.add(tag);
                }

                button.classList.toggle("active", selectedTags.has(tag));
                button.setAttribute("aria-pressed", selectedTags.has(tag) ? "true" : "false");
                updateTagFilterSummary();
                updateResults();
            });
        }

        document.querySelectorAll("input[name='tag-match-mode']").forEach((radio) => {
            radio.addEventListener("change", (event) => {
                const nextMode = event.target.value === "intersection" ? "intersection" : "union";
                tagMatchMode = nextMode;
                updateTagFilterSummary();
                updateResults();
            });
        });

        listEl.addEventListener("click", (event) => {
            const toggleButton = event.target.closest(".description-toggle");
            if (toggleButton) {
                const textEl = toggleButton.closest(".description-wrap")?.querySelector(".description-text");
                if (!textEl) {
                    return;
                }

                const expanded = toggleButton.dataset.expanded === "true";
                const nextExpanded = !expanded;
                const html = nextExpanded
                    ? decodeURIComponent(toggleButton.dataset.fullHtml || "")
                    : decodeURIComponent(toggleButton.dataset.shortHtml || "");
                textEl.innerHTML = html;
                toggleButton.dataset.expanded = nextExpanded ? "true" : "false";
                toggleButton.textContent = nextExpanded ? "顯示更少" : "顯示更多";
                return;
            }

            const button = event.target.closest(".copy-btn");
            if (!button) {
                return;
            }
            copyCode(button.dataset.code || "");
        });

        loadCoupons();
    </script>
</body>
</html>
