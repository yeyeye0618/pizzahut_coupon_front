<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="keywords" content="必勝客折價券,Pizza Hut優惠,必勝客優惠代碼,必勝客coupon,披薩折扣,必勝客外送優惠" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pizzahut-coupon-front.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pizza Hut 折價券大全｜640+ 必勝客優惠代碼" />
    <meta property="og:description" content="收錄 640+ 筆台灣必勝客折價券優惠代碼，依口味、尺寸、配餐篩選，一鍵複製即可訂餐。" />
    <meta property="og:url" content="https://pizzahut-coupon-front.vercel.app/" />
    <meta property="og:locale" content="zh_TW" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Pizza Hut 折價券大全｜640+ 必勝客優惠代碼" />
    <meta name="twitter:description" content="收錄 640+ 筆台灣必勝客折價券優惠代碼，一鍵複製即可訂餐。" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pizza Hut 折價券大全",
      "url": "https://pizzahut-coupon-front.vercel.app/",
      "description": "收錄台灣必勝客折價券優惠代碼，支援篩選與一鍵複製",
      "inLanguage": "zh-TW",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://pizzahut-coupon-front.vercel.app/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1>必勝客折價券大全</h1>
            <p class="subtitle">收錄台灣 Pizza Hut 最新優惠代碼，支援依口味、尺寸、配餐篩選，一鍵複製即可訂餐。</p>
            <div class="controls">
                <label class="search-box" for="search-input">
                    <span class="search-icon" aria-hidden="true"></span>
                    <input id="search-input" type="text" placeholder="搜尋代碼或優惠內容..." />
                </label>
                <div class="pill">總數 <span id="total-count">0</span></div>
                <div class="pill">顯示 <span id="visible-count">0</span></div>
            </div>
            <div class="filter-bar">
                <div class="filter-head">
                    <div id="tags-filter-list" class="tags-filter-list" aria-live="polite"></div>
                    <div class="filter-tools">
                        <div class="match-mode" role="radiogroup" aria-label="標籤篩選模式">
                            <label class="mode-option">
                                <input type="radio" name="tag-match-mode" value="union" checked />
                                OR
                            </label>
                            <label class="mode-option">
                                <input type="radio" name="tag-match-mode" value="intersection" />
                                AND
                            </label>
                        </div>
                        <label class="sort-control" for="sort-select">
                            <span>排序</span>
                            <select id="sort-select">
                                <option value="price-asc">價格由低到高</option>
                                <option value="price-desc">價格由高到低</option>
                            </select>
                        </label>
                    </div>
                </div>
            </div>
            <p id="status" class="status" aria-live="polite"></p>
        </section>

        <section>
            <div id="coupon-list" class="grid" aria-live="polite"></div>
            <div id="infinite-trigger" class="infinite-trigger" aria-live="polite" hidden></div>
            <div id="empty-state" class="empty" hidden>找不到符合條件的折價券，試試看不同關鍵字。</div>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/main.js"></script>
</body>
</html>
